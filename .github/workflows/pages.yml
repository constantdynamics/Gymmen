name: Deploy GymWave to GitHub Pages

on:
  push:
    branches:
      # main is waar alles samenkomt. claude/gymwave-fitness-tracker-rOZRi staat
      # er nog bij zolang die de default branch is: de github-pages-omgeving laat
      # alleen de default branch deployen, dus een push naar main alléén wordt
      # geweigerd. Zodra main de default branch is, mag de tweede regel weg.
      - main
      - claude/gymwave-fitness-tracker-rOZRi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # De versieregel in de app moet de commit tonen die er echt op staat. Handmatig
      # bijhouden gaat een keer mis, dus stempelen we hem hier. De controle erna laat de
      # deploy falen als de vervanging niet lukte: een versieregel die iets anders beweert
      # dan er staat is erger dan geen versieregel.
      - name: Versie stempelen
        run: |
          set -euo pipefail
          VERSIE="${GITHUB_SHA:0:7} · $(date -u '+%d-%m-%Y')"
          sed -i "s|^const APP_VERSION = \"dev\";$|const APP_VERSION = \"$VERSIE\";|" index.html
          grep -qxF "const APP_VERSION = \"$VERSIE\";" index.html \
            || { echo "::error::Versieregel niet gevonden of niet vervangen in index.html"; exit 1; }
          echo "Gestempeld: $VERSIE"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
