name: Deploy GymWave to GitHub Pages

on:
  push:
    branches:
      # main is waar alles samenkomt. claude/gymwave-fitness-tracker-rOZRi staat
      # er nog bij zolang die de default branch is: de github-pages-omgeving laat
      # alleen de default branch deployen, dus een push naar main alléén wordt
      # geweigerd. Zodra main de default branch is, mag de tweede regel weg.
      - main
      - claude/gymwave-fitness-tracker-rOZRi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
