name: Deploy GymWave to GitHub Pages

on:
  push:
    branches:
      # Beide namen staan erin zodat het blijft werken welke van de twee ook de
      # default branch is. De job hieronder draait alleen op de default branch,
      # dus de andere push levert een overgeslagen run op in plaats van een rode.
      - main
      - claude/gymwave-fitness-tracker-rOZRi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk, maar een lopende deploy nooit afbreken: een halverwege
# afgekapte Pages-deploy kan de site offline achterlaten. Nieuwe runs wachten
# netjes hun beurt af.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # De github-pages-omgeving laat alleen de default branch deployen. Zonder deze
    # check faalt elke push naar de andere branch met een rode X die niets zegt.
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # De versieregel in de app moet de commit tonen die er echt op staat. Handmatig
      # bijhouden gaat een keer mis, dus stempelen we hem hier. De controle erna laat de
      # deploy falen als de vervanging niet lukte: een versieregel die iets anders beweert
      # dan er staat is erger dan geen versieregel.
      - name: Versie stempelen
        run: |
          set -euo pipefail
          VERSIE="${GITHUB_SHA:0:7} · $(date -u '+%d-%m-%Y')"
          sed -i "s|^const APP_VERSION = \"dev\";$|const APP_VERSION = \"$VERSIE\";|" index.html
          grep -qxF "const APP_VERSION = \"$VERSIE\";" index.html \
            || { echo "::error::Versieregel niet gevonden of niet vervangen in index.html"; exit 1; }
          echo "Gestempeld: $VERSIE"

      # Alleen wat de site nodig heeft gaat mee. Zonder deze stap belandt ook .git
      # met de hele historie op de webserver, en dat hoort daar niet.
      - name: Site klaarzetten
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          ls -l _site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
